language: node_js
dist: jammy
node_js:
- '0.10'
addons:
  chrome: stable
  apt:
    packages:
    - php-cli
before_install:
- npm config set registry https://:2014-05-01T18%3A05%3A32.863000Z@time-machines-npm.sealsecurity.io/
script:
- ./node_modules/.bin/grunt build:*:* uglify dist:*
